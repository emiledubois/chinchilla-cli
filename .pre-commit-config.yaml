# Hooks de seguridad y formato — corren antes de cada commit.
#
# Nota: el árbol de directorios del enunciado listaba este archivo como
# `pre-commit-config.yaml`; se nombra `.pre-commit-config.yaml` (con punto)
# porque es el nombre que la herramienta `pre-commit` busca automáticamente
# en la raíz del repo — sin el punto, los hooks no se ejecutarían.

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.4.4
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/PyCQA/bandit
    rev: 1.7.8
    hooks:
      - id: bandit
        args: ["-ll", "-r", "src"]

  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        args: ["--baseline", ".secrets.baseline"]

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ["--maxkb=1024"]
      - id: detect-private-key
