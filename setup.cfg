[mutmut]
# mutmut 2.x (ver requirements.txt para por qué está fijado a esta serie).
# Alcance acotado a los módulos de lógica pura (no CLI/IO/PDF) por costo:
# cada mutante corre la suite completa, y el ROI de mutar código de
# presentación es bajo frente al tiempo de CI.
paths_to_mutate=src/models/assessment.py,src/utils/security.py,src/certification/models.py
tests_dir=tests/
runner=python -m pytest tests/unit tests/design tests/property -x -q
