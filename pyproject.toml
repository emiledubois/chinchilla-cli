[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "preaudit-cli"
version = "0.1.0"
description = "Herramienta de preauditoría de cumplimiento normativo (Ley 21.633, Ley 21.719, OWASP Top 10) para organizaciones chilenas."
requires-python = ">=3.11"
readme = "README.md"
dependencies = [
    "click>=8.1,<9",
    "rich>=13.7,<14",
    "pydantic>=2.7,<3",
    "reportlab>=4.2,<5",
]

[project.scripts]
preaudit = "src.cli:preaudit"

[tool.setuptools]
packages = [
    "src",
    "src.questions",
    "src.models",
    "src.report",
    "src.report.templates",
    "src.utils",
]

[tool.ruff]
line-length = 125
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "S", "B", "UP"]
# S101 (assert): permitido en tests. Se excluye vía per-file-ignores abajo.

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]
