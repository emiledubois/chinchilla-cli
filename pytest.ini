[pytest]
pythonpath = .
testpaths = tests
# TestPlanMeta/TestCase/TestTechnique en src/certification/models.py son
# modelos Pydantic, no clases de prueba; pytest los detecta por el prefijo
# "Test" cuando se importan en un archivo de tests. No son fallos.
filterwarnings =
    ignore::pytest.PytestCollectionWarning
